# adapted from the CRN_Learn case study: 
# https://github.com/ASAP-CRN/asap-crn-learning-lab/blob/80fa9a561768e367a6324bd17207fc706dfaf907/case_studies/SN_CellType_Annotation/environment.yml

name: my_sn_celltyping_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - jupyterlab
  - pandas
  - numpy<2          # for TensorFlow compatibility
  - matplotlib
  - seaborn
  - pillow
  - scanpy
  - decoupler-py
  - scvi-tools>=0.20
  - umap-learn>=0.5.5
  - scikit-learn>=1.2
  - numba>=0.57
  - llvmlite>=0.40
  - python-igraph
  - leidenalg
  - seaborn             # Enhanced heatmaps, violin plots, boxplots
  - statannotations     # Adding p-value brackets directly onto Scanpy/Seaborn plots
  - gseapy              # Pathway and Gene Set Enrichment Analysis (GSEA) on marker genes
  - statsmodels         # Advanced statistical testing and regression models
  - pip
  - pip:
    - scib-metrics
    - ipywidgets
    - "cell_type_mapper @ git+https://github.com/alleninstitute/cell_type_mapper.git@rc/v1.5.2"
    - "abc_atlas_access[notebooks] @ git+https://github.com/alleninstitute/abc_atlas_access.git"
    - mygene
    - pynndescent
    
